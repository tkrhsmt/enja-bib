name: Typst tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# 依存関係の読み取りと Actions の成果物アップロードだけを許可する。
permissions:
  contents: read

# 同じ PR / ブランチで新しいコミットが来た場合は古い実行を停止する。
concurrency:
  group: typst-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tinymist test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 0.15.x は Typst 0.15 系と対応する Tinymist の安定版系列。
      - name: Install Tinymist
        env:
          TINYMIST_VERSION: 0.15.x
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/Myriad-Dreamin/tinymist/releases/download/${TINYMIST_VERSION}/tinymist-installer.sh" | sh

      # テスト関数（test-*）を実行し、coverage.json も生成する。
      # システムフォントを除外して OS 間で再現可能な描画結果にする。
      - name: Run Typst tests
        run: tinymist test src/runtest.typ --root . --ignore-system-fonts --coverage --print-coverage=full

      # 失敗時にもカバレッジ情報を確認できるよう常にアップロードする。
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinymist-coverage
          path: target/coverage.json
          if-no-files-found: warn
